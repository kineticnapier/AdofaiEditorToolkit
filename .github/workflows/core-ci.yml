name: Core CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build portable core
        run: dotnet build ./src/ADOFAI.EditorToolkit/ADOFAI.EditorToolkit.csproj -c Release -f netstandard2.0
      - name: Run core tests
        run: dotnet run --project ./tests/ADOFAI.EditorToolkit.Tests/ADOFAI.EditorToolkit.Tests.csproj -c Release
